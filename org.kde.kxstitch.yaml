id: org.kde.kxstitch
runtime: org.kde.Platform
runtime-version: 5.15-25.08
sdk: org.kde.Sdk
command: kxstitch
rename-icon: kxstitch
finish-args:
  # X11 + XShm access
  - --socket=x11
  - --share=ipc
  # Wayland
  - --socket=wayland
  # OpenGL
  - --device=dri
  # Connectivity
  - --share=network
  # Audio
  - --socket=pulseaudio
cleanup:
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: imagemagick
    config-opts:
      - --disable-static
      - --disable-docs
      - --without-utilities
    sources:
      - type: archive
        url: https://github.com/ImageMagick/ImageMagick/archive/7.1.2-36.tar.gz
        sha256: 5ba807e38a6bcb7c3c96a166485e270c5017aaa6b166f0440dc4b2badf6e6167
        x-checker-data:
          type: anitya
          project-id: 1372
          stable-only: true
          url-template: https://github.com/ImageMagick/ImageMagick/archive/$version.tar.gz
    cleanup:
      - /bin
      - /etc
      - /include
      - /lib/pkgconfig
      - /lib/ImageMagick-*
      - /share/ImageMagick-*

  - name: kxstitch
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://download.kde.org/stable/kxstitch/3.0.0/kxstitch-3.0.0.tar.xz
        sha256: b8684c1971893ecc9e5ee3bc3e7ea45ba3f690f7c972897a50bd2c08bce7f28e
        x-checker-data:
          is-main-source: true
          type: anitya
          project-id: 10579
          stable-only: true
          url-template: https://download.kde.org/stable/kxstitch/$version/kxstitch-$version.tar.xz
      - type: patch
        path: update-appdata.patch
    cleanup:
      - /share/icons/hicolor/icon-theme.cache
